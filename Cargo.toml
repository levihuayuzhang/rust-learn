cargo-features = ["profile-rustflags"]

[workspace]
members = [
    "the-book-practices/*",
    "pancakes",
    "rustlings",
    "tutorials/async-tutorial/*",
    "tutorials/thread-tutorial/*",
    "rustonomicon/*",
    "learning-rust-with-entirely-too-many-linked-lists/*",
]
exclude = ["os-in-rust/blog_os"]
resolver = "3"

[profile.dev]
opt-level = 0
debug = true
# strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
# panic = 'unwind'
incremental = true
codegen-units = 256 # The default is 256 for incremental builds, 
# rpath = false

[profile.release]
opt-level = 3
debug = false
# strip = "none"
debug-assertions = false
overflow-checks = false
lto = true
# panic = 'unwind'
incremental = false
codegen-units = 16  # The default is 16 for non-incremental builds.
# rpath = false

[profile.release.package."*"]
rustflags = ["-Ctarget-cpu=native"]
